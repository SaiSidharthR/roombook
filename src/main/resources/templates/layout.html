<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | RoomBook'">RoomBook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/roombook.css}">
</head>
<body>
<nav th:fragment="navigation" class="navbar navbar-expand-lg app-navbar">
    <div class="container-xl">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark"><i class="bi bi-grid-1x2-fill"></i></span>
            <span>RoomBook</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav me-auto ms-lg-4">
                <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Overview</a>
                <a class="nav-link" th:href="@{/rooms}"><i class="bi bi-door-open me-1"></i>Rooms</a>
                <a class="nav-link" th:href="@{/bookings}"><i class="bi bi-calendar3 me-1"></i>Bookings</a>
                <a class="nav-link" th:if="${isAdmin}" th:href="@{/employees}"><i class="bi bi-people me-1"></i>Employees</a>
            </div>
            <div class="d-flex align-items-center gap-3 account-menu">
                <span class="account-email" th:text="${currentEmail}">user@example.com</span>
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-sm btn-outline-dark" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Sign out</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<div th:fragment="flashes" class="container-xl pt-3">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
