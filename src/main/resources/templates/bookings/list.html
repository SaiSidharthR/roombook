<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Bookings')}"></head>
<body>
<nav th:replace="~{layout :: navigation}"></nav>
<div th:replace="~{layout :: flashes}"></div>
<main class="container-xl page-wrap">
    <header class="page-heading">
        <div><p class="eyebrow">ROOM SCHEDULE</p><h1>Bookings</h1><p class="page-subtitle" th:text="${isAdmin} ? 'All meetings across your organization.' : 'Meetings you have organized.'">Meetings you have organized.</p></div>
        <a class="btn btn-brand" th:href="@{/bookings/new}"><i class="bi bi-plus-lg me-2"></i>New booking</a>
    </header>
    <section th:if="${#lists.isEmpty(bookings)}" class="empty-state">
        <span class="empty-icon"><i class="bi bi-calendar2-week"></i></span><h3>No bookings yet</h3><p>Your upcoming meetings will appear here.</p>
        <a class="btn btn-brand" th:href="@{/bookings/new}">Book a room</a>
    </section>
    <section th:unless="${#lists.isEmpty(bookings)}" class="table-responsive schedule-table-wrap">
        <table class="table align-middle schedule-table">
            <thead><tr><th>WHEN</th><th>ROOM</th><th th:if="${isAdmin}">ORGANIZER</th><th>STATUS</th><th>CHECK-IN</th><th class="text-end">ACTIONS</th></tr></thead>
            <tbody><tr th:each="booking : ${bookings}">
                <td class="booking-datetime"><strong th:text="${#temporals.format(booking.startTime, 'EEE, MMM d')}"></strong><small><span th:text="${#temporals.format(booking.startTime, 'h:mm a')}"></span> – <span th:text="${#temporals.format(booking.endTime, 'h:mm a')}"></span></small></td>
                <td><strong th:text="${booking.room.name}"></strong><small th:text="${booking.room.location}"></small></td>
                <td th:if="${isAdmin}" th:text="${booking.organizer.name}"></td>
                <td><span class="status-pill" th:classappend="${booking.status.name() == 'CONFIRMED'} ? ' status-confirmed' : ' status-muted'" th:text="${booking.status.name().replace('_', ' ')}"></span></td>
                <td><span th:if="${booking.checkedIn}" class="checkin-state"><i class="bi bi-check-circle-fill"></i> Checked in</span><span th:unless="${booking.checkedIn}" class="text-secondary">Not checked in</span></td>
                <td><div class="table-actions">
                    <a th:if="${booking.status.name() == 'CONFIRMED' and !booking.checkedIn}" class="btn btn-sm btn-outline-dark" th:href="@{/bookings/{id}/edit(id=${booking.id})}" aria-label="Edit booking"><i class="bi bi-pencil"></i></a>
                    <form th:if="${booking.status.name() == 'CONFIRMED' and !booking.checkedIn}" th:action="@{/bookings/{id}/check-in(id=${booking.id})}" method="post"><button class="btn btn-sm btn-outline-success" type="submit">Check in</button></form>
                    <form th:if="${booking.status.name() == 'CONFIRMED'}" th:action="@{/bookings/{id}/cancel(id=${booking.id})}" method="post" onsubmit="return confirm('Cancel this booking?')"><button class="btn btn-sm btn-outline-danger" type="submit">Cancel</button></form>
                </div></td>
            </tr></tbody>
        </table>
    </section>
</main>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
