spring.application.name=roombook
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roombook?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

roombook.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
roombook.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
